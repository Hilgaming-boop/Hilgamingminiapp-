<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HilGaming MODs</title>
  <link rel="stylesheet" href="style.css" />
  
  <!-- Telegram + Ads SDKs -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src='//libtl.com/sdk.js' data-zone='9590572' data-sdk='show_9590572'></script>
  <script src="https://ads.telega.io/ads.js"></script>
  <script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>
  <script>
    window.TelegramAdsController = new TelegramAdsController();
    window.TelegramAdsController.initialize({
      pubId: "960688",
      appId: "2901",
    });
  </script>
  <script src="https://inapp.telega.io/sdk/v1/sdk.js"></script>
</head>
<body>
  <header>
    <h1>HilGaming MODs</h1>
    <input type="text" id="search" placeholder="Search for mods or paste the ID...">
  </header>

  <!-- Onde os posts vão aparecer -->
  <main id="posts"></main>

  <script>
    const ads = window.TelegaIn.AdsController.create_miniapp({
      token: '9b1e446b-5af2-4051-b66d-d4ceeca10a62'
    });

    // Lista de mods
    const mods = [
      {
        "title": "FC 26 Mod FIFA 16 Android Mobile",
        "images": [
          "https://i.postimg.cc/MTbvmwvh/Screenshot-20250804-124612-You-Tube.png",
          "https://i.postimg.cc/d1KhC3t2/Screenshot-20250804-124624-You-Tube.png"
        ],
        "video": "",
        "downloads": [
          { "label": "📱 APK", "url": "https://example.com/apk" },
          { "label": "📂 OBB", "url": "https://example.com/obb" },
          { "label": "💾 DATA", "url": "https://example.com/data" }
        ]
      },
      {
        "title": "💥FTS 26 MOBILE🎮 MOD EA SPORTS FC 26 OFFLINE",
        "images": [
          "https://i.postimg.cc/fyPVb33C/20250801-223835.png",
          "https://i.postimg.cc/j22WK6jC/Video-Capture-20250802-141506.jpg"
        ],
        "video": "https://www.youtube.com/embed/fcQN10dljM8?autoplay=1&mute=1",
        "download": "https://www.mediafire.com/file/k7ubw4i6tjbooxm/FTS_mod_EA_FC_26_New_Transfer_Update.zip/file"
      }
    ];

    const container = document.getElementById('posts');

    // Cria cada post
    function createPost(mod) {
      return `
        <section class="post">
          <h2>${mod.title}</h2>
          <div class="slideshow">
            ${mod.images.map(img => `<img src="${img}" alt="${mod.title}">`).join('')}
          </div>
          ${mod.video ? `<iframe src="${mod.video}" frameborder="0" allowfullscreen></iframe>` : ""}
          <div class="downloads">
            ${
              mod.downloads
              ? mod.downloads.map(d => `
                  <button onclick="showAdThenDownload('${d.url}', this)">
                    ⬇️ Download ${d.label}
                  </button>
                `).join('')
              : `<button onclick="showAdThenDownload('${mod.download}', this)">⬇️ Download MOD</button>`
            }
          </div>
        </section>`;
    }

    // Carrega todos os posts
    function loadPosts() {
      container.innerHTML = mods.map(createPost).join('');
    }

    // Mostra anúncio e depois libera download
    function showAdThenDownload(url, btn) {
      btn.disabled = true;
      btn.textContent = "⏳ Watching ad...";

      if (typeof show_9590572 !== "undefined") {
        show_9590572().then(() => {
          alert("✅ Ad completed! Download link unlocked.");
          window.open(url, '_blank');
        }).catch(() => {
          alert("⚠️ You must watch the full ad to unlock the link.");
        }).finally(() => {
          btn.textContent = "⬇️ Download";
          btn.disabled = false;
        });
      } else {
        alert("⚠️ Ad service not available, opening download directly...");
        window.open(url, '_blank');
        btn.textContent = "⬇️ Download";
        btn.disabled = false;
      }
    }

    // Pesquisa
    document.getElementById('search').addEventListener('input', function () {
      const q = this.value.toLowerCase();
      const filtered = mods.filter(m => m.title.toLowerCase().includes(q));
      container.innerHTML = filtered.map(createPost).join('');
    });

    Telegram.WebApp.expand();
    loadPosts();
  </script>

  <style>
    body { font-family: sans-serif; margin: 0; background: #f4f4f4; color: #333; }
    header { padding: 1em; background: #111; color: #fff; text-align: center; }
    header input { padding: 0.5em; width: 90%; margin-top: 10px; border-radius: 6px; border: none; }
    main { padding: 1em; }
    .post { background: #fff; margin: 1em 0; padding: 1em; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .slideshow img { width: 100%; border-radius: 8px; margin: 0.5em 0; }
    iframe { width: 100%; height: 200px; border-radius: 8px; margin-top: 10px; }
    .downloads { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 10px; }
    button { background: #111; color: #fff; padding: 0.7em 1em; border: none; border-radius: 6px; cursor: pointer; }
    button:disabled { background: #777; }
  </style>
</body>
</html>
