<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Download MOD</title>
  <style>
    body { font-family: sans-serif; padding: 20px; text-align: center; background: #f2f2f2; }
    .btn { padding: 12px 20px; border: none; color: #fff; background: #1d72b8; border-radius: 6px; cursor: pointer; font-size: 16px; }
    .btn:disabled { background: #aaa; cursor: not-allowed; }
    #countdown { font-size: 20px; margin: 20px 0; }
    #download { margin-top: 20px; display: none; }
    #rewardedAdBtn { margin-top: 15px; background: #4caf50; }
  </style>
  <script src="https://js.monetag.com/show.js"></script>
</head>
<body>

  <h2>EFOOTBALL 26 MOD | Download without ads</h2>
  <img src="https://i.postimg.cc/fyHXpR7p/Screenshot-20250715-113322-You-Tube.png" width="100%" alt="MOD Preview">

  <div id="countdown">Please wait <span id="timer">60</span> seconds to unlock download.</div>

  <button class="btn" id="rewardedAdBtn">Watch Ad to Unlock Now</button>

  <a id="download" class="btn" href="https://gplinks.co/Efootball26">Download MOD</a>

  <script>
    let timeLeft = 60;
    const timerElement = document.getElementById("timer");
    const downloadBtn = document.getElementById("download");

    const countdown = setInterval(() => {
      timeLeft--;
      timerElement.textContent = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(countdown);
        downloadBtn.style.display = "inline-block";
        document.getElementById("countdown").style.display = "none";
        document.getElementById("rewardedAdBtn").style.display = "none";
      }
    }, 1000);

    // Ad Reward Unlock
    document.getElementById("rewardedAdBtn").onclick = () => {
      show_9590572('pop').then(() => {
        clearInterval(countdown);
        downloadBtn.style.display = "inline-block";
        document.getElementById("countdown").style.display = "none";
        document.getElementById("rewardedAdBtn").style.display = "none";
        alert("Download unlocked. Thank you for watching!");
      }).catch(() => {
        alert("Ad failed to load. Please try again.");
      });
    };
  </script>
</body>
</html>
